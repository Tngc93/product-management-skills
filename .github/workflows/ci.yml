name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Example documents pass the linter
        run: npm run lint:examples

  agent-docs:
    name: AGENTS.md matches the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Tngc93/repo-onboarding@v0.1.0
        with:
          strict: "true"
